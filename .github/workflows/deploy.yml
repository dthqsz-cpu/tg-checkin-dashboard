name: 部署签到台账

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5
        with:
          # 首次运行时自动在仓库设置里把 Pages 的发布来源切成 GitHub Actions
          enablement: true

      # 只把页面需要的文件打包，避免 .git 之类的东西进产物
      - name: 准备静态文件
        run: |
          mkdir -p _site
          cp -r index.html assets data _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

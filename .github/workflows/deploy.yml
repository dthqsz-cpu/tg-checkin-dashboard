name: 部署签到台账

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5
        with:
          # 首次运行时自动在仓库设置里把 Pages 的发布来源切成 GitHub Actions
          enablement: true

      # 只把页面需要的文件打包，避免 .git 之类的东西进产物。
      # 顺手把资源地址里的 __VERSION__ 换成提交号：GitHub Pages 的缓存会留
      # 十分钟左右，带上版本号以后，改完页面刷新就能看到新的。
      - name: 准备静态文件
        run: |
          mkdir -p _site
          cp -r index.html assets data _site/
          # 根目录下的站点验证文件（各种 *.txt）也要发布，不然访问会 404
          cp ./*.txt _site/ 2>/dev/null || true
          sed -i "s/__VERSION__/${GITHUB_SHA::7}/g" _site/index.html
          grep -o 'assets/[a-z]*\.css?v=[0-9a-f]*\|assets/[a-z]*\.js?v=[0-9a-f]*' _site/index.html
          ls -1 _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
